name: release

# Runs on a version tag (v1.0.0, v1.1.0, …). Builds the fat jar, the
# Docker image and pushes both to GHCR.
#
# Image target is read from the repository variable IMAGE_REGISTRY
# (Repository → Settings → Variables → Actions). Defaults to
# ghcr.io/<owner-of-the-repo> so a fresh fork pushes to its own owner
# without any setup. Set IMAGE_REGISTRY=ghcr.io/itech-ci in the
# upstream repo when you flip the official location.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # required to create the GitHub Release and upload assets
      packages: write   # required to push to GHCR

    env:
      IMAGE_NAME: sigdep-sync

    steps:
      - name: Resolve tag
        id: tag
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          # Strip leading 'refs/tags/' if present and the leading 'v'
          ref="${ref#refs/tags/}"
          echo "tag=$ref" >> $GITHUB_OUTPUT
          echo "version=${ref#v}" >> $GITHUB_OUTPUT
          # SHA court + date de build (ISO 8601 UTC) — injectés dans le JAR
          # (build-info) et les labels OCI de l'image. On dérive le SHA du
          # contexte GitHub (toujours disponible, AVANT tout checkout ; un
          # 'git rev-parse' ici échouerait car le dépôt n'est pas encore
          # checkouté et laisserait git.sha vide → build-info en erreur).
          sha="${{ github.sha }}"
          echo "sha_short=${sha:0:7}" >> $GITHUB_OUTPUT
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      # Compute the image registry now (rather than as a static env)
      # because docker requires lowercase repository names and
      # github.repository_owner can be mixed-case ("Pkom17").
      - name: Resolve image registry
        id: registry
        run: |
          override="${{ vars.IMAGE_REGISTRY }}"
          if [[ -n "$override" ]]; then
            registry="$override"
          else
            owner="${{ github.repository_owner }}"
            registry="ghcr.io/${owner,,}"
          fi
          echo "registry=$registry" >> $GITHUB_OUTPUT

      - name: Checkout sigdep-sync
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # Try the same tag first on sigdep-contracts ; fall back to master
      # if the tag doesn't exist there (rare — they're usually released
      # together). actions/checkout refuses paths outside the workspace
      # so we put the sibling inside the workspace and reference it as
      # ./.sigdep-contracts.
      - name: Checkout sigdep-contracts (matching tag)
        id: ck-contracts-tag
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sigdep-contracts
          ref: ${{ steps.tag.outputs.tag }}
          path: .sigdep-contracts
        continue-on-error: true

      - name: Fallback to contracts master if tag missing
        if: steps.ck-contracts-tag.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sigdep-contracts
          ref: master
          path: .sigdep-contracts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install sigdep-contracts to local M2
        working-directory: .sigdep-contracts
        run: mvn -B -DskipTests install

      - name: Build sigdep-sync fat jar
        # -Drevision=<version> aligne la version du JAR (finalName, manifest,
        # build-info) sur le tag Git et l'image Docker. -Dgit.sha capture le
        # commit dans META-INF/build-info.properties (logué au démarrage).
        run: >-
          mvn -B -DskipTests package
          -Drevision=${{ steps.tag.outputs.version }}
          -Dgit.sha=${{ steps.tag.outputs.sha_short }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build LOCAL d'abord (chargé dans le démon, PAS poussé) : on veut faire
      # tourner un smoke test de démarrage avant de publier quoi que ce soit.
      - name: Build Docker image (local, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ steps.registry.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
            ${{ steps.registry.outputs.registry }}/${{ env.IMAGE_NAME }}:latest
          # Les métadonnées OCI sont posées par les LABEL du Dockerfile,
          # alimentés par ces build-args (version = tag, revision = SHA,
          # created = date de build). Cohérent avec le build-info du JAR.
          build-args: |
            IMAGE_VERSION=${{ steps.tag.outputs.version }}
            IMAGE_REVISION=${{ steps.tag.outputs.sha_short }}
            IMAGE_CREATED=${{ steps.tag.outputs.created }}

      # Smoke test de démarrage — l'image doit passer les DEUX cas avant d'être
      # publiée. Empêche de pousser une image qui ne démarre pas ou dont le
      # fail-fast de configuration est cassé.
      - name: Smoke test — startup & fail-fast
        env:
          IMAGE: ${{ steps.registry.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail

          echo "::group::Cas 1 — démarrage sans base OpenMRS accessible"
          # Config minimale VALIDE ; MySQL injoignable (l'échec de connexion est
          # attendu et ne doit PAS faire échouer le test). Succès = le message
          # 'Started SigdepSyncApplication' apparaît en < 60 s.
          docker rm -f smoke1 >/dev/null 2>&1 || true
          docker run -d --name smoke1 \
            -e SIGDEP_SITE_CODE=SMOKE001 \
            -e SIGDEP_CENTRAL_API_URL=https://hub.example.org \
            -e SIGDEP_API_KEY=smoke-ci-key-1234 \
            -e SIGDEP_LOCAL_DB_URL="jdbc:mysql://127.0.0.1:3306/openmrs?connectTimeout=2000" \
            "$IMAGE" >/dev/null

          started=false
          for i in $(seq 1 60); do
            if docker logs smoke1 2>&1 | grep -q "Started SigdepSyncApplication"; then
              started=true
              echo "OK — 'Started SigdepSyncApplication' au bout de ${i}s"
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke1 2>/dev/null)" = "false" ]; then
              echo "Le conteneur s'est arrêté avant le message de démarrage :"
              docker logs smoke1 2>&1 | tail -30
              break
            fi
            sleep 1
          done
          docker rm -f smoke1 >/dev/null 2>&1 || true
          if [ "$started" != "true" ]; then
            echo "::error::Cas 1 échoué — l'agent n'a pas démarré en moins de 60 s."
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Cas 2 — configuration invalide (fail-fast)"
          # SIGDEP_CENTRAL_API_URL sans schéma → le démarrage DOIT échouer avec
          # un code non nul et un message nommant la variable fautive.
          docker rm -f smoke2 >/dev/null 2>&1 || true
          set +e
          docker run --name smoke2 \
            -e SIGDEP_SITE_CODE=SMOKE001 \
            -e SIGDEP_CENTRAL_API_URL=hub.example.org \
            -e SIGDEP_API_KEY=smoke-ci-key-1234 \
            -e SIGDEP_LOCAL_DB_URL="jdbc:mysql://127.0.0.1:3306/openmrs" \
            "$IMAGE" >smoke2.log 2>&1
          code=$?
          set -e
          echo "Code de sortie : $code"
          cat smoke2.log | tail -20
          if [ "$code" -eq 0 ]; then
            echo "::error::Cas 2 échoué — le conteneur aurait dû s'arrêter avec un code non nul."
            docker rm -f smoke2 >/dev/null 2>&1 || true
            exit 1
          fi
          if ! grep -q "SIGDEP_CENTRAL_API_URL" smoke2.log; then
            echo "::error::Cas 2 échoué — le message ne nomme pas SIGDEP_CENTRAL_API_URL."
            docker rm -f smoke2 >/dev/null 2>&1 || true
            exit 1
          fi
          echo "OK — arrêt en code $code, message nommant SIGDEP_CENTRAL_API_URL"
          docker rm -f smoke2 >/dev/null 2>&1 || true
          rm -f smoke2.log
          echo "::endgroup::"

      # Push SEULEMENT si le smoke test a réussi (l'étape précédente aurait fait
      # échouer le job sinon). Réutilise le cache de layers du build local.
      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.registry.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
            ${{ steps.registry.outputs.registry }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            IMAGE_VERSION=${{ steps.tag.outputs.version }}
            IMAGE_REVISION=${{ steps.tag.outputs.sha_short }}
            IMAGE_CREATED=${{ steps.tag.outputs.created }}

      # -----------------------------------------------------------------
      # Windows packaging — assemble a ZIP with everything a site needs
      # to install sigdep-sync as a Windows service : WinSW, the fat
      # jar, an embedded Temurin 17 JRE, and the helper batch scripts.
      # The ZIP is attached to the GitHub Release of this tag.
      # -----------------------------------------------------------------
      - name: Download WinSW
        run: |
          # Pin the WinSW version explicitly so future releases don't
          # surprise us. v3.0.0 is the current stable as of this writing.
          mkdir -p windows-build
          curl -fsSL -o windows-build/sigdep-sync-service.exe \
            https://github.com/winsw/winsw/releases/download/v3.0.0-alpha.11/WinSW-net461.exe

      - name: Download Temurin 17 JRE for Windows x64
        run: |
          # Adoptium publishes versioned URLs ; we pin a known-good build
          # to avoid breakage when a new patch is released.
          curl -fsSL -o windows-build/jre.zip \
            "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jre/hotspot/normal/eclipse?project=jdk"
          cd windows-build
          unzip -q jre.zip
          # Adoptium's zip extracts to jdk-17.x.x+yy-jre/ ; rename to jre/
          mv jdk-17* jre
          rm jre.zip

      - name: Stage Windows package
        run: |
          PKG=sigdep-sync-windows-${{ steps.tag.outputs.version }}
          mkdir -p "windows-build/$PKG"

          # WinSW binary + matching config (WinSW expects them to share
          # the same base name).
          cp windows-build/sigdep-sync-service.exe "windows-build/$PKG/sigdep-sync-service.exe"
          cp packaging/windows/sigdep-sync.xml      "windows-build/$PKG/sigdep-sync-service.xml"

          # Application jar (renamed from sigdep-sync-x.y.z.jar to a
          # stable name so the WinSW XML doesn't need a per-version edit).
          cp target/sigdep-sync-*.jar "windows-build/$PKG/sigdep-sync.jar"

          # Embedded JRE.
          cp -r windows-build/jre "windows-build/$PKG/jre"

          # Helper scripts + .env template + local README.
          cp packaging/windows/install-service.bat        "windows-build/$PKG/"
          cp packaging/windows/uninstall-service.bat      "windows-build/$PKG/"
          cp packaging/windows/sigdep-sync.env.example    "windows-build/$PKG/"
          cp packaging/windows/README.md                  "windows-build/$PKG/README.md"

      - name: Create Windows ZIP
        run: |
          PKG=sigdep-sync-windows-${{ steps.tag.outputs.version }}
          cd windows-build
          zip -qr "../${PKG}.zip" "$PKG"
          ls -lh "../${PKG}.zip"

      # -----------------------------------------------------------------
      # Linux packaging — self-contained tarball : the fat jar, an
      # embedded Temurin 17 JRE (Linux x64), the systemd unit template
      # and the install/uninstall scripts. No Java needed on the site.
      # -----------------------------------------------------------------
      - name: Download Temurin 17 JRE for Linux x64
        run: |
          mkdir -p linux-build
          curl -fsSL -o linux-build/jre.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jre/hotspot/normal/eclipse?project=jdk"
          tar -C linux-build -xzf linux-build/jre.tar.gz
          mv linux-build/jdk-17* linux-build/jre
          rm linux-build/jre.tar.gz

      - name: Stage Linux package
        run: |
          PKG=sigdep-sync-linux-${{ steps.tag.outputs.version }}
          mkdir -p "linux-build/$PKG"

          # Application jar (stable name) + embedded JRE.
          cp target/sigdep-sync-*.jar "linux-build/$PKG/sigdep-sync.jar"
          cp -r linux-build/jre        "linux-build/$PKG/jre"

          # systemd unit template + scripts + .env template + README.
          cp packaging/linux/sigdep-sync.service.template "linux-build/$PKG/"
          cp packaging/linux/install.sh                   "linux-build/$PKG/"
          cp packaging/linux/uninstall.sh                 "linux-build/$PKG/"
          cp packaging/linux/sigdep-sync.env.example      "linux-build/$PKG/"
          cp packaging/linux/README.md                    "linux-build/$PKG/README.md"
          chmod +x "linux-build/$PKG/install.sh" "linux-build/$PKG/uninstall.sh"

      - name: Create Linux tarball
        run: |
          PKG=sigdep-sync-linux-${{ steps.tag.outputs.version }}
          # Tar preserves the +x bit on the scripts and the JRE binaries.
          tar -C linux-build -czf "${PKG}.tar.gz" "$PKG"
          ls -lh "${PKG}.tar.gz"

      - name: Create or update GitHub Release with installer assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          ZIP=sigdep-sync-windows-${{ steps.tag.outputs.version }}.zip
          TGZ=sigdep-sync-linux-${{ steps.tag.outputs.version }}.tar.gz

          # Create the release if it doesn't exist yet ; on re-runs we
          # just upload (--clobber) so a workflow_dispatch retry works.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Release $TAG. See CHANGELOG.md for details." \
              --verify-tag
          fi

          gh release upload "$TAG" "$ZIP" "$TGZ" --clobber

      - name: Summary
        run: |
          echo "### Docker images published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.registry.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.registry.outputs.registry }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installeurs autonomes (jar + JRE embarqué)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Windows (service) : \`sigdep-sync-windows-${{ steps.tag.outputs.version }}.zip\`" >> $GITHUB_STEP_SUMMARY
          echo "- Linux (systemd)   : \`sigdep-sync-linux-${{ steps.tag.outputs.version }}.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Attachés à la release [${{ steps.tag.outputs.tag }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }})" >> $GITHUB_STEP_SUMMARY
